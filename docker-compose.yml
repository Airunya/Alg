services:
  semaphore:
    image: semaphoreui/semaphore:v2.15.0
    container_name: semaphore
    restart: unless-stopped
    environment:
      - SEMAPHORE_DB_USER=semaphore
      - SEMAPHORE_DB_PASS=111
      - SEMAPHORE_DB_HOST=127.0.0.1
      - SEMAPHORE_DB_PORT=3306
      - SEMAPHORE_DB=semaphore
      - SEMAPHORE_DB_DIALECT=mysql
      - SEMAPHORE_ADMIN_PASSWORD=111
      - SEMAPHORE_ADMIN_NAME=admin
      - SEMAPHORE_ADMIN_EMAIL=ololo@lolo.lol
      - SEMAPHORE_ADMIN=admin
      - SEMAPHORE_ACCESS_KEY_ENCRYPTION=n/D5/Z8y4pY8by9niRnaK+Del5v1WgpkjuH3Pjf494c=
    volumes:
      - semaphore_data:/tmp/semaphore
    depends_on:
      - db
    network_mode: host

  db:
    image: mysql:8.0
    container_name: semaphore_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=111
      - MYSQL_DATABASE=semaphore
      - MYSQL_USER=semaphore
      - MYSQL_PASSWORD=111
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    network_mode: host
    command: --default-authentication-plugin=mysql_native_password

volumes:
  semaphore_data:
    driver: local
  mysql_data:
    driver: local